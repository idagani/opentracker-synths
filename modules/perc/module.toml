# OpenTracker module manifest (core: docs/PLAN_3X.md §7.2, tools/profile.py).
id      = "PRC1"
name    = "PERC synth"
version = "1.0.0"
api     = 1                         # core module API major (modules/module.h kModuleApi)
entry   = "percModule"                   # ot::mod::IModule& ot::mod::percModule()
caps    = ["synthEngine"]
sources = ["perc.cpp", "perc_desc.cpp", "perc_module.cpp"]   # in src/; basenames unique across a profile
tests   = ["engine_perc_test.cpp"]        # in tests/; built and run by the core's host-test

# Declared budgets, checked by tools/profile.py (flash after the link, per object).
flash_max_bytes   = 28500
sram_audio_bytes  = 0
