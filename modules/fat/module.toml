# OpenTracker module manifest (core: docs/PLAN_3X.md §7.2, tools/profile.py).
id      = "FAT1"
name    = "FAT synth"
version = "1.0.0"
api     = 1                         # core module API major (modules/module.h kModuleApi)
entry   = "fatModule"                   # ot::mod::IModule& ot::mod::fatModule()
caps    = ["synthEngine"]
sources = ["fat.cpp", "fat_desc.cpp", "fat_module.cpp"]   # in src/; basenames unique across a profile
tests   = ["engine_fat_test.cpp"]        # in tests/; built and run by the core's host-test

# Declared budgets, checked by tools/profile.py (flash after the link, per object).
flash_max_bytes   = 14400
sram_audio_bytes  = 0
sdram_bytes       = 0
fastrun_bytes     = 1800
cpu_insn_per_unit = 22000              # bench-m4 limit per unit
max_units         = 8
bench             = "fat"
engines           = [2]              # Tracker Mini engine id served (unique in a profile)
